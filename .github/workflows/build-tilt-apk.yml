name: Build tilt + head-tracking APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Enable Yarn
        run: corepack enable

      # ---- source patches (order matters: tilt first, head tracking second) ----
      - name: Apply tilt patch
        run: python3 .github/apply_tilt_patch.py

      - name: Apply head tracking patch
        run: python3 .github/apply_headtrack_patch.py

      - name: Save a diff of everything the patches changed
        if: always()
        run: |
          git add -A -N . || true
          git diff > patches.diff || true
          git diff --stat | tail -25 || true

      # ---- MediaPipe face model, bundled into the APK (no network needed at runtime) ----
      - name: Download face landmarker model
        run: |
          mkdir -p android/app/src/main/assets
          curl -fL --retry 3 --retry-delay 2 \
            -o android/app/src/main/assets/face_landmarker.task \
            https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task
          SIZE=$(stat -c%s android/app/src/main/assets/face_landmarker.task)
          echo "face_landmarker.task = $SIZE bytes"
          test "$SIZE" -gt 2000000

      - name: Install JS dependencies
        run: yarn install

      - name: Add Rust Android target
        run: rustup target add aarch64-linux-android

      - name: Build dev release APK (debug-signed, arm64 only)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDevRelease --no-daemon \
            -PreactNativeArchitectures=arm64-v8a \
            -PXSTREAMING_RELEASE_STORE_FILE=debug.keystore \
            -PXSTREAMING_RELEASE_KEY_ALIAS=androiddebugkey \
            -PXSTREAMING_RELEASE_STORE_PASSWORD=android \
            -PXSTREAMING_RELEASE_KEY_PASSWORD=android

      - name: Sign if the APK came out unsigned
        run: |
          cd android/app/build/outputs/apk/dev/release
          ls -la
          if ls *unsigned*.apk >/dev/null 2>&1; then
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            "$BT/zipalign" -f -p 4 *unsigned*.apk aligned.apk
            "$BT/apksigner" sign \
              --ks "$GITHUB_WORKSPACE/android/app/debug.keystore" \
              --ks-pass pass:android --key-pass pass:android \
              --ks-key-alias androiddebugkey \
              --out xstreaming-head.apk aligned.apk
            rm -f aligned.apk *unsigned*.apk
          fi
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: xstreaming-head-apk
          path: android/app/build/outputs/apk/dev/release/*.apk

      # ---- always keep the diff; on failure also keep the Gradle reports ----
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: patches-diff
          path: patches.diff
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gradle-reports
          path: |
            android/app/build/reports
            android/build/reports
          if-no-files-found: ignore